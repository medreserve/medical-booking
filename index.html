<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProMedical Booking</title>
    <style>
        :root {
            --primary: #4a90e2;
            --secondary: #50c878;
            --dark: #2c3e50;
            --light: #f8f9fa;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #eef2f7; margin: 0; padding: 20px; color: var(--dark); }
        .container { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        /* Animations */
        .step { display: none; animation: fadeIn 0.5s ease-in-out; }
        .step.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Modern Inputs & Buttons */
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 2px solid #e1e8ed; border-radius: 10px; transition: 0.3s; }
        input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 8px rgba(74, 144, 226, 0.2); }
        
        button { 
            padding: 12px 25px; border: none; border-radius: 10px; cursor: pointer; 
            transition: all 0.3s ease; font-weight: bold; transform: scale(1);
        }
        button:hover { transform: scale(1.03); filter: brightness(1.1); }
        button:active { transform: scale(0.98); }
        
        .btn-primary { background: var(--primary); color: white; width: 100%; }
        .btn-success { background: var(--secondary); color: white; width: 100%; }
        .btn-back { background: transparent; color: #7f8c8d; text-decoration: underline; margin-top: 10px; }
        
        h2 { text-align: center; color: var(--primary); }
        .doc-card { background: #f9f9f9; padding: 15px; border-radius: 15px; margin: 10px 0; border-left: 5px solid var(--primary); transition: 0.3s; }
        .doc-card:hover { background: #edf4fd; }
    </style>
</head>
<body>

<div class="container">
    <h2>🏥 ProMedical</h2>
    
    <!-- Step 0: Welcome -->
    <div id="step-0" class="step active">
        <p style="text-align: center;">Professional medical booking system at your fingertips.</p>
        <button class="btn-primary" onclick="nextStep(1)">Start Booking</button>
        <button class="btn-back" style="display:block; margin: 10px auto;" onclick="showLoginSection()">Are you a Doctor?</button>
    </div>

    <!-- Step 1: Patient Info -->
    <div id="step-1" class="step">
        <h3>Patient Details</h3>
        <input type="text" id="firstName" placeholder="First Name">
        <input type="text" id="lastName" placeholder="Last Name">
        <input type="tel" id="phone" placeholder="Phone Number">
        <button class="btn-primary" onclick="validateStep1()">Next</button>
    </div>

    <!-- Step 2: Location & Type -->
    <div id="step-2" class="step">
        <h3>Find your Doctor</h3>
        <input type="text" id="state" placeholder="State (Wilaya)">
        <input type="text" id="municipality" placeholder="Municipality">
        <select id="doctorType" onchange="toggleSpecialty()">
            <option value="General">General Practitioner</option>
            <option value="Specialist">Specialist</option>
        </select>
        <input type="text" id="specialty" placeholder="Specialty (if any)" style="display:none;">
        <button class="btn-primary" onclick="fetchAvailableDoctors()">Search Doctors</button>
        <button class="btn-back" onclick="nextStep(1)">Back</button>
    </div>

    <!-- Step 4: Results -->
    <div id="step-4" class="step">
        <h3>Available Doctors</h3>
        <div id="doctorsListContainer"></div>
        <button class="btn-back" onclick="nextStep(2)">Back</button>
    </div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzNEPYYi95HjeeYV9h-Iy0ktNXYM2tChQSUAh8unXOrZ6vgNHvEukW_2py58n_dkH2b/exec';

    function nextStep(step) {
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        document.getElementById(`step-${step}`).classList.add('active');
    }

    function toggleSpecialty() {
        document.getElementById('specialty').style.display = 
            (document.getElementById('doctorType').value === 'Specialist') ? 'block' : 'none';
    }

    function fetchAvailableDoctors() {
        // [نفس كود جلب البيانات السابق مع تحديث الـ HTML لعرض doc-card]
        // يمكنك إكمال باقي الوظائف بنفس المنطق السابق مع إضافة كلاس doc-card للعناصر
        alert('Searching...');
        nextStep(4);
    }
    
    // تأكد من ربط الرابط في الأعلى بنفس الطريقة السابقة
</script>
</body>
</html>
