<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .step { display: none; }
        .step.active { display: block; }
        h2 { color: #2c3e50; text-align: center; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 5px; }
        button { margin-top: 20px; padding: 12px 20px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; width: 100%; }
        button:hover { background: #2980b9; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #f2f2f2; }
    </style>
</head>
<body>

<div class="container">
    <!-- Main Menu -->
    <div id="step-home" class="step active">
        <h2>Medical Appointment System</h2>
        <button onclick="showStep('step-book')">Book an Appointment</button>
        <button onclick="showStep('step-login')" style="background:#27ae60;">Doctor Login</button>
    </div>

    <!-- Booking Form -->
    <div id="step-book" class="step">
        <h2>Book Appointment</h2>
        <label>First Name</label><input type="text" id="pFirstName">
        <label>Last Name</label><input type="text" id="pLastName">
        <label>Specialty</label><select id="pSpecialty"></select>
        <button onclick="searchDoctors()">Search Doctors</button>
        <button onclick="showStep('step-home')" style="background:#95a5a6;">Back</button>
    </div>

    <!-- Doctor Login -->
    <div id="step-login" class="step">
        <h2>Doctor Login</h2>
        <label>Email</label><input type="email" id="dEmail">
        <label>Password</label><input type="password" id="dPass">
        <button onclick="loginDoctor()">Login</button>
        <button onclick="showStep('step-home')" style="background:#95a5a6;">Back</button>
    </div>

    <!-- Doctor Dashboard -->
    <div id="step-dashboard" class="step">
        <h2>Doctor Dashboard</h2>
        <div id="dashboard-content">
            <h3>Upcoming Appointments</h3>
            <table id="apptTable">
                <thead><tr><th>Patient</th><th>Date</th><th>Queue</th></tr></thead>
                <tbody></tbody>
            </table>
            <h3>Settings</h3>
            <label>Daily Limit</label>
            <input type="number" id="dailyLimit">
            <button onclick="updateSettings()">Save Settings</button>
        </div>
        <button onclick="location.reload()" style="background:#e74c3c;">Logout</button>
    </div>
</div>

<script>
    function showStep(stepId) {
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
        document.getElementById(stepId).classList.add('active');
    }

    // هنا يتم ربط الدوال مع Google Apps Script (عبر google.script.run)
    function searchDoctors() { alert("Searching..."); }
    function loginDoctor() { showStep('step-dashboard'); }
    function updateSettings() { alert("Settings Updated!"); }

    // تحميل التخصصات عند فتح الصفحة
    window.onload = function() {
        // يمكنك استدعاء دالة من Apps Script لجلب التخصصات وتعبئة القائمة
        // google.script.run.withSuccessHandler(fillSpecialties).getSpecialties();
    };
</script>

</body>
</html>
