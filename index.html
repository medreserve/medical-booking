<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Appointment System</title>
    <style>
        :root { 
            --primary: #2563eb; 
            --secondary: #10b981; 
            --dark: #1e293b; 
            --light: #f8fafc;
            --danger: #ef4444;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f1f5f9; margin: 0; padding: 0; color: var(--dark); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .container { 
            width: 100%; max-width: 850px; min-height: 520px;
            margin: 20px; background: white; padding: 40px; 
            border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.06); 
            box-sizing: border-box;
        }
        
        .step { display: none; animation: fadeIn 0.4s ease-in-out; }
        .step.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .full-width { grid-column: span 2; }
        
        input, select { width: 100%; padding: 14px; margin: 8px 0; border: 2px solid #e2e8f0; border-radius: 12px; box-sizing: border-box; transition: 0.3s; font-size: 15px; background: #fafafa; }
        input:focus, select:focus { border-color: var(--primary); outline: none; background: #fff; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }
        label { font-weight: 600; font-size: 14px; color: #475569; display: block; margin-top: 10px; }

        .btn-group { display: flex; gap: 15px; margin-top: 25px; }
        button { padding: 14px 24px; border: none; border-radius: 12px; cursor: pointer; transition: all 0.3s ease; font-weight: 600; font-size: 15px; width: 100%; }
        button:hover { transform: translateY(-2px); filter: brightness(1.05); }
        button:active { transform: scale(0.98); }
        
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--secondary); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-back { background: #e2e8f0; color: #475569; width: auto; padding: 14px 30px; }
        .btn-link { background: none; border: none; color: var(--primary); text-decoration: underline; cursor: pointer; margin-top: 15px; width: auto; display: inline-block; font-size: 14px; }

        h2, h3 { color: var(--primary); margin-top: 0; font-size: 26px; text-align: center; margin-bottom: 25px; }
        
        .doc-card { background: #f8fafc; padding: 20px; border-radius: 16px; margin-bottom: 15px; border-left: 6px solid var(--primary); display: flex; justify-content: space-between; align-items: center; border: 1px solid #e2e8f0; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #e2e8f0; padding: 12px; text-align: center; font-size: 14px; }
        th { background: var(--primary); color: white; }

        @media (max-width: 768px) {
            .container { padding: 20px; margin: 10px; max-width: 100%; }
            .form-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
            .doc-card { flex-direction: column; align-items: flex-start; gap: 15px; }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Step 0: Home -->
    <div id="step-0" class="step active" style="text-align: center; padding: 40px 0;">
        <h2 style="font-size: 32px; margin-bottom: 15px;">Medical Appointment Booking</h2>
        <p style="color: #64748b; font-size: 16px; margin-bottom: 35px;">Select your option below to proceed.</p>
        <div style="max-width: 400px; margin: auto;">
            <button class="btn-primary" onclick="nextStep(1)" style="padding: 18px; font-size: 16px; margin-bottom: 15px;">Book an Appointment</button>
            <br>
            <button class="btn-link" onclick="showLoginSection()" style="font-size: 16px;">Are you a Doctor? Log in</button>
        </div>
    </div>

    <!-- Step 1: Patient Info -->
    <div id="step-1" class="step">
        <h3>Patient Information</h3>
        <div class="form-grid">
            <div><label>First Name:</label><input type="text" id="firstName" placeholder="First name"></div>
            <div><label>Last Name:</label><input type="text" id="lastName" placeholder="Last name"></div>
            <div><label>Phone:</label><input type="tel" id="phone" placeholder="05xxxxxxxx"></div>
            <div><label>Email:</label><input type="email" id="email" placeholder="email@domain.com"></div>
        </div>
        <div class="btn-group">
            <button class="btn-back" onclick="nextStep(0)">Back</button>
            <button class="btn-primary" onclick="validateStep1()">Next</button>
        </div>
    </div>

    <!-- Step 2: Location (Dependent Dropdowns) -->
    <div id="step-2" class="step">
        <h3>Select Location</h3>
        <div class="form-grid">
            <div class="full-width">
                <label>State (Wilaya):</label>
                <select id="state" onchange="updateDistricts()"><option value="">Select State</option></select>
            </div>
            <div class="full-width">
                <label>Municipality (Baladiya):</label>
                <select id="municipality"><option value="">Select Municipality</option></select>
            </div>
        </div>
        <div class="btn-group">
            <button class="btn-back" onclick="nextStep(1)">Back</button>
            <button class="btn-primary" onclick="nextStep(3)">Next</button>
        </div>
    </div>

    <!-- Step 3: Doctor Type -->
    <div id="step-3" class="step">
        <h3>Doctor Specialty</h3>
        <label>Select Type:</label>
        <select id="doctorType" onchange="toggleSpecialty()">
            <option value="General">General Practitioner</option>
            <option value="Specialist">Specialist</option>
        </select>
        <div id="specialtyContainer" style="display: none;">
            <label>Specialty:</label>
            <select id="specialty"><option value="">Select Specialty</option></select>
        </div>
        <div class="btn-group">
            <button class="btn-back" onclick="nextStep(2)">Back</button>
            <button class="btn-primary" onclick="fetchAvailableDoctors()">Search Doctors</button>
        </div>
    </div>

    <!-- Step 4: Results & Booking -->
    <div id="step-4" class="step">
        <h3>Select Doctor & Date</h3>
        <div id="doctorsListContainer" style="max-height: 250px; overflow-y: auto; border: 2px solid #e2e8f0; padding: 15px; border-radius: 14px; background: #fafafa; margin-bottom: 15px;">
            <p style="color: #64748b; text-align: center;">No doctors loaded yet.</p>
        </div>
        <input type="hidden" id="selectedDoctorName">
        <p id="chosenDoctorDisplay" style="font-weight: 600; color: var(--secondary); text-align: center; margin: 10px 0; font-size: 16px;"></p>
        <label>Appointment Date & Time:</label>
        <input type="datetime-local" id="appointmentDate">
        <div class="btn-group">
            <button class="btn-back" onclick="nextStep(3)">Back</button>
            <button class="btn-success" onclick="submitBooking()">Confirm Booking</button>
        </div>
    </div>

    <!-- Doctor Login -->
    <div id="doctor-login-section" class="step">
        <h3>Doctor Login</h3>
        <div style="max-width: 400px; margin: auto;">
            <label>Email:</label><input type="email" id="loginEmail" placeholder="Email">
            <label>Password:</label><input type="password" id="loginPassword" placeholder="Password">
            <div class="btn-group">
                <button class="btn-back" onclick="nextStep(0)">Home</button>
                <button class="btn-primary" onclick="doctorLogin()">Login</button>
            </div>
            <div style="text-align: center; margin-top: 20px;">
                <button class="btn-link" onclick="showSignUpSection()">Don't have an account? Sign Up</button>
            </div>
        </div>
    </div>

    <!-- Doctor Sign Up -->
    <div id="doctor-signup-section" class="step">
        <h3>Doctor Registration</h3>
        <div class="form-grid">
            <div><label>First Name:</label><input type="text" id="docFirstName" placeholder="First Name"></div>
            <div><label>Last Name:</label><input type="text" id="docLastName" placeholder="Last Name"></div>
            <div><label>Phone:</label><input type="tel" id="docPhone" placeholder="Phone"></div>
            <div><label>Email:</label><input type="email" id="docEmail" placeholder="Email"></div>
            <div class="full-width"><label>Password:</label><input type="password" id="docPassword" placeholder="Password"></div>
            
            <!-- القوائم المترابطة للتسجيل -->
            <div class="full-width"><label>State (Wilaya):</label><select id="docState" onchange="updateDocDistricts()"><option value="">Select State</option></select></div>
            <div class="full-width"><label>Municipality (Baladiya):</label><select id="docMunicipality"><option value="">Select Municipality</option></select></div>
            
            <div class="full-width"><label>Clinic Address:</label><input type="text" id="docAddress" placeholder="Street / Landmark"></div>
            <div>
                <label>Type:</label>
                <select id="docType" onchange="toggleDocSpecialty()">
                    <option value="General">General</option>
                    <option value="Specialist">Specialist</option>
                </select>
            </div>
            <div id="docSpecialtyContainer" style="display: none;" class="full-width">
                <label>Specialty:</label>
                <select id="docSpecialty"><option value="">Select Specialty</option></select>
            </div>
        </div>
        <div class="btn-group">
            <button class="btn-back" onclick="showLoginSection()">Back</button>
            <button class="btn-success" onclick="doctorSignUp()">Register</button>
        </div>
    </div>

    <!-- Doctor Dashboard -->
    <div id="doctor-dashboard" class="step">
        <h3>Doctor Dashboard</h3>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #f8fafc; padding: 15px; border-radius: 12px;">
            <span id="welcomeDocName" style="font-weight: 600; color: var(--primary); font-size: 16px;"></span>
            <button class="btn-back" onclick="logoutDoctor()" style="padding: 8px 14px; font-size: 13px; width: auto;">Logout</button>
        </div>
        <h4 style="color: #475569;">Booked Appointments:</h4>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr><th>First</th><th>Last</th><th>Phone</th><th>Email</th><th>Date</th></tr>
                </thead>
                <tbody id="appointmentsList"><tr><td colspan="5">Loading...</td></tr></tbody>
            </table>
        </div>
    </div>

</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwQEtns8VCPKCNG2NJ6bXH-WtPP40lL3_ZgmpR2-ZXjWcejplEOWi1_9W-25XeGGFSU/exec';
    let settingsData = [];

    // تحميل إعدادات الأماكن والتخصصات من الشيت عند فتح الصفحة
    fetch(`${scriptURL}?action=get_settings`)
        .then(res => res.json())
        .then(data => {
            settingsData = data;
            let states = [...new Set(data.map(item => item[0]))];
            populateSelect('state', states);
            populateSelect('docState', states);
        });

    function populateSelect(id, items) {
        let sel = document.getElementById(id);
        sel.innerHTML = '<option value="">Select</option>' + items.map(i => `<option value="${i}">${i}</option>`).join('');
    }

    function updateDistricts() {
        let state = document.getElementById('state').value;
        let munis = [...new Set(settingsData.filter(i => i[0] === state).map(i => i[2]))];
        populateSelect('municipality', munis);
    }

    function updateDocDistricts() {
        let state = document.getElementById('docState').value;
        let munis = [...new Set(settingsData.filter(i => i[0] === state).map(i => i[2]))];
        populateSelect('docMunicipality', munis);
        let specs = [...new Set(settingsData.filter(i => i[0] === state).map(i => i[3]).filter(Boolean))];
        populateSelect('docSpecialty', specs);
    }

    function nextStep(step) {
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        document.getElementById(`step-${step}`).classList.add('active');
    }

    function showLoginSection() {
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        document.getElementById('doctor-login-section').classList.add('active');
    }

    function showSignUpSection() {
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        document.getElementById('doctor-signup-section').classList.add('active');
    }

    function validateStep1() {
        if(!document.getElementById('firstName').value || !document.getElementById('phone').value) {
            alert('Please fill in your name and phone number.');
            return;
        }
        nextStep(2);
    }

    function toggleSpecialty() {
        let isSpecialist = document.getElementById('doctorType').value === 'Specialist';
        document.getElementById('specialtyContainer').style.display = isSpecialist ? 'block' : 'none';
        if(isSpecialist) {
            let specs = [...new Set(settingsData.map(i => i[3]).filter(Boolean))];
            populateSelect('specialty', specs);
        }
    }

    function toggleDocSpecialty() {
        document.getElementById('docSpecialtyContainer').style.display = (document.getElementById('docType').value === 'Specialist') ? 'block' : 'none';
    }

    function doctorSignUp() {
        const docData = {
            action: 'signup',
            firstName: document.getElementById('docFirstName').value,
            lastName: document.getElementById('docLastName').value,
            phone: document.getElementById('docPhone').value,
            email: document.getElementById('docEmail').value,
            password: document.getElementById('docPassword').value,
            state: document.getElementById('docState').value,
            circle: '',
            municipality: document.getElementById('docMunicipality').value,
            address: document.getElementById('docAddress').value,
            type: document.getElementById('docType').value,
            specialty: document.getElementById('docSpecialty').value || ''
        };

        if(!docData.email || !docData.password || !docData.firstName) {
            alert('Please fill in required fields.');
            return;
        }

        alert('Creating account...');
        fetch(scriptURL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(docData) })
        .then(() => { alert('Account created successfully!'); showLoginSection(); })
        .catch(err => alert('Error: ' + err));
    }

    function doctorLogin() {
        const email = document.getElementById('loginEmail').value;
        const pass = document.getElementById('loginPassword').value;
        if(!email || !pass) { alert('Enter email and password.'); return; }

        alert('Verifying...');
        fetch(scriptURL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'login', email, password: pass }) })
        .then(res => res.json())
        .then(data => {
            if(data.result === 'success') {
                document.getElementById('welcomeDocName').innerText = `Welcome, ${data.doctor.fullName}`;
                document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
                document.getElementById('doctor-dashboard').classList.add('active');
                fetchAppointments(data.doctor.fullName);
            } else { alert(data.message); }
        }).catch(() => alert('Login error.'));
    }

    function fetchAvailableDoctors() {
        const state = document.getElementById('state').value;
        const municipality = document.getElementById('municipality').value;
        const type = document.getElementById('doctorType').value;
        const specialty = document.getElementById('specialty').value || '';

        if(!state || !municipality) { alert('Fill location fields.'); return; }

        alert('Searching...');
        fetch(`${scriptURL}?action=get_doctors&state=${encodeURIComponent(state)}&municipality=${encodeURIComponent(municipality)}&type=${encodeURIComponent(type)}&specialty=${encodeURIComponent(specialty)}`)
        .then(res => res.json())
        .then(data => {
            const container = document.getElementById('doctorsListContainer');
            container.innerHTML = '';
            if(data.length === 0) {
                container.innerHTML = '<p style="color: red; text-align: center;">No doctors found.</p>';
                nextStep(4);
                return;
            }
            data.forEach(doc => {
                container.innerHTML += `
                    <div class="doc-card">
                        <div>
                            <strong>${doc.fullName}</strong> (${doc.type} ${doc.specialty ? '- ' + doc.specialty : ''})<br>
                            <small style="color: #64748b;">📍 ${doc.address || 'No address'}</small>
                        </div>
                        <button class="btn-success" style="width: auto; padding: 8px 16px;" onclick="selectDoctor('${doc.fullName}')">Select</button>
                    </div>`;
            });
            nextStep(4);
        });
    }

    function selectDoctor(docName) {
        document.getElementById('selectedDoctorName').value = docName;
        document.getElementById('chosenDoctorDisplay').innerText = `Selected: ${docName}`;
        alert(`Selected ${docName}. Now choose date.`);
    }

    function submitBooking() {
        const bookingData = {
            action: 'book',
            firstName: document.getElementById('firstName').value,
            lastName: document.getElementById('lastName').value,
            phone: document.getElementById('phone').value,
            email: document.getElementById('email').value,
            state: document.getElementById('state').value,
            doctor: document.getElementById('selectedDoctorName').value,
            appointmentDate: document.getElementById('appointmentDate').value
        };

        if(!bookingData.email || !bookingData.appointmentDate || !bookingData.doctor) {
            alert('Complete email, doctor selection, and date.');
            return;
        }

        alert('Confirming booking...');
        fetch(scriptURL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(bookingData) })
        .then(() => { alert('Booked successfully!'); location.reload(); });
    }

    function fetchAppointments(doctorName) {
        fetch(`${scriptURL}?doctorName=${encodeURIComponent(doctorName)}`)
        .then(res => res.json())
        .then(data => {
            const tbody = document.getElementById('appointmentsList');
            tbody.innerHTML = '';
            if(data.length === 0) { tbody.innerHTML = '<tr><td colspan="5">No appointments.</td></tr>'; return; }
            data.forEach(app => {
                tbody.innerHTML += `<tr><td>${app.firstName}</td><td>${app.lastName}</td><td>${app.phone}</td><td>${app.email}</td><td>${app.appointmentDate}</td></tr>`;
            });
        });
    }

    function logoutDoctor() {
        nextStep(0);
    }
</script>
</body>
</html>
